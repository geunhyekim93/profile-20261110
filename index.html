<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>김근혜 프로필로 이동</title>
  <meta http-equiv="refresh" content="0; url=dist/index.html">
  <script>
    const profileUrl = new URL("dist/index.html", window.location.href);
    profileUrl.search = window.location.search;
    profileUrl.hash = window.location.hash;
    window.location.replace(profileUrl.href);
  </script>
  <style>
    body { margin: 0; padding: 48px 24px; background: #f8f7e9; color: #33332f; font-family: sans-serif; line-height: 1.8; }
    a { color: inherit; text-underline-offset: 5px; }
    a:focus-visible { outline: 2px solid #7a5929; outline-offset: 6px; }
  </style>
</head>
<body>
  <p>프로필 페이지로 이동합니다.</p>
  <p><a href="dist/index.html">김근혜 프로필 바로 열기</a></p>
</body>
</html>
